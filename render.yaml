# Render Blueprint (https://render.com/docs/blueprint-spec). NOT applied automatically:
# nothing is deployed until the repository owner connects it in the Render dashboard.
# Verified against the current spec: runtime/dockerfilePath/healthCheckPath/autoDeployTrigger.
#
# Free-plan behaviour (render.com/docs/free): the service spins down after 15 minutes without traffic and takes
# about a minute to start again; the filesystem is ephemeral. This app needs no persistent storage: it serves a
# pinned snapshot baked into the image, and the UI shows a "service may be starting" hint if the first request fails.
services:
  - type: web
    name: wind-forecast-intelligence
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"      # deploy deliberately, not on every commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_SOURCE_MODE
        value: snapshot
      - key: LOG_LEVEL
        value: INFO
